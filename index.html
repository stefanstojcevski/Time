<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TIME Coffee Bar — Дигитално Мени</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <svg style="display:none" aria-hidden="true">
    <symbol id="olive-branch" viewBox="0 0 240 60">
      <path d="M5 30 C 60 10, 180 10, 235 30" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
      <ellipse cx="35" cy="24" rx="11" ry="5" transform="rotate(-35 35 24)" fill="none" stroke="currentColor" stroke-width="1.2" />
      <ellipse cx="65" cy="14" rx="11" ry="5" transform="rotate(20 65 14)" fill="none" stroke="currentColor" stroke-width="1.2" />
      <ellipse cx="98" cy="10" rx="11" ry="5" transform="rotate(-15 98 10)" fill="none" stroke="currentColor" stroke-width="1.2" />
      <ellipse cx="135" cy="9" rx="11" ry="5" transform="rotate(15 135 9)" fill="none" stroke="currentColor" stroke-width="1.2" />
      <ellipse cx="170" cy="13" rx="11" ry="5" transform="rotate(-20 170 13)" fill="none" stroke="currentColor" stroke-width="1.2" />
      <ellipse cx="200" cy="22" rx="11" ry="5" transform="rotate(25 200 22)" fill="none" stroke="currentColor" stroke-width="1.2" />
      <circle cx="225" cy="29" r="4.5" fill="currentColor" />
    </symbol>
  </svg>

  <header class="hero">
    <svg class="olive-watermark olive-watermark--top" aria-hidden="true">
      <use href="#olive-branch" />
    </svg>
    <svg class="olive-watermark olive-watermark--bottom" aria-hidden="true">
      <use href="#olive-branch" />
    </svg>

    <div class="lang-toggle" aria-label="Избор на јазик">
      <button class="lang-btn active" data-lang="mk">МК</button>
      <span class="lang-sep">|</span>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>

    <div class="hero-content">
      <h1 class="logo">TIME</h1>
      <p class="logo-sub">Coffee Bar</p>
      <div class="hero-ornament" aria-hidden="true">◆</div>
      <p class="tagline" id="tagline">Каде секој момент си заслужува пауза.</p>
    </div>
  </header>

  <section class="search-section">
    <input
      type="text"
      id="searchInput"
      class="search-input"
      placeholder="Пребарај пијалок или јадење..."
    />
  </section>

  <nav class="category-nav">
    <div class="category-list" id="categoryList">
    </div>
  </nav>

  <div class="section-divider" aria-hidden="true"></div>

  <main class="products-section">
    <svg class="olive-watermark olive-watermark--content" aria-hidden="true">
      <use href="#olive-branch" />
    </svg>

    <div class="products-grid" id="productsGrid"></div>

    <div class="no-results" id="noResults" hidden>
      <p class="no-results-title" id="noResultsTitle">Нема резултати 🍃</p>
      <p class="no-results-text" id="noResultsText">Пробај друг збор или категорија.</p>
    </div>
  </main>

  <footer class="site-footer">
    <svg class="olive-divider olive-divider--footer" aria-hidden="true">
      <use href="#olive-branch" />
    </svg>

    <p class="footer-name">TIME Coffee Bar</p>
    <p class="footer-line" id="footerAddress">Плоштад, Цар Самоил, Ресен</p>
    <p class="footer-line" id="footerHours">Секој ден до 00:00</p>
    <p class="footer-line">
      <span id="footerSocial">Следете нè на Instagram:</span>
      <a href="https://www.instagram.com/time_coffee_bar/"
         target="_blank"
         rel="noopener noreferrer"
         class="footer-link">@time_coffee_bar</a>
    </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
